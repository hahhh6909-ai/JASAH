<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMY_ILD — Bio Link & Katalog Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-hover: #1e293b;
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Navbar TIMY_ILD */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-toggle-btn:hover, .admin-toggle-btn.active {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Banner Sambutan Tengah Atas */
        .welcome-banner {
            text-align: center;
            padding: 16px 14px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(59, 130, 246, 0.08));
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.08);
        }

        .welcome-subtitle {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .welcome-title {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            background: linear-gradient(90deg, #10b981, #34d399, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        /* Header & Profil */
        .profile-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-wrapper {
            position: relative;
            width: 104px;
            height: 104px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #eab308;
            padding: 2px;
            background: var(--bg-color);
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #3b82f6;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid var(--bg-color);
        }

        .profile-name {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 92%;
        }

        /* Ikon Sosial Media */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 4px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        /* Navigasi Tab */
        .tabs {
            display: flex;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Konten Tab */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Daftar Tautan Utama */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--primary);
            transform: scale(1.01);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .link-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .link-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Etalase Produk Digital */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            background: #1e293b;
        }

        .product-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-badge {
            align-self: flex-start;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
        }

        .buy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: var(--primary-hover);
        }

        /* PANEL ADMIN */
        .admin-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 16px;
            padding: 18px;
            flex-direction: column;
            gap: 16px;
        }

        .admin-panel.open {
            display: flex;
        }

        .admin-section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .admin-item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .share-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .share-btn:hover {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar Brand & Tombol Admin -->
    <div class="top-bar">
        <div class="brand-logo">
            <i class="fas fa-link"></i> TIMY_ILD
        </div>
        <button class="admin-toggle-btn" id="adminToggleBtn" onclick="toggleAdmin()">
            <i class="fas fa-cog"></i> Kelola Halaman
        </button>
    </div>

    <!-- TULISAN SAMBUTAN TENGAH ATAS -->
    <div class="welcome-banner">
        <div class="welcome-subtitle">WELCOME TO MY SITUS</div>
        <div class="welcome-title">TIMY_ILD</div>
    </div>

    <!-- PANEL ADMIN -->
    <section id="adminPanel" class="admin-panel">
        <div class="admin-section-title"><i class="fas fa-user-edit"></i> Pengaturan Profil & WhatsApp</div>
        <div class="form-group">
            <label>Nama Tampilan</label>
            <input type="text" id="inputName" class="form-input">
        </div>
        <div class="form-group">
            <label>Bio Singkat</label>
            <input type="text" id="inputBio" class="form-input">
        </div>
        <div class="form-group">
            <label>URL / Nama File Foto Profil</label>
            <input type="text" id="inputAvatar" class="form-input">
        </div>
        <div class="form-group">
            <label>Nomor WhatsApp Order (Awalan 62)</label>
            <input type="text" id="inputWA" class="form-input" placeholder="6281234567890">
        </div>
        <button class="btn-primary" onclick="saveProfile()">Simpan Perubahan Profil</button>

        <div class="admin-section-title" style="margin-top: 8px;"><i class="fas fa-plus-circle"></i> Tambah Tautan Baru</div>
        <div class="form-group">
            <input type="text" id="newLinkTitle" class="form-input" placeholder="Judul Tautan">
            <input type="text" id="newLinkSub" class="form-input" placeholder="Subjudul singkat">
            <input type="url" id="newLinkUrl" class="form-input" placeholder="URL Tujuan (https://...)">
            <button class="btn-primary" onclick="addLink()">+ Tambah Tautan</button>
        </div>
        <div id="adminLinkList" class="admin-item-list"></div>

        <div class="admin-section-title" style="margin-top: 8px;"><i class="fas fa-shopping-bag"></i> Tambah Produk Digital</div>
        <div class="form-group">
            <input type="text" id="newProdBadge" class="form-input" placeholder="Kategori (misal: Source Code / E-Book)">
            <input type="text" id="newProdTitle" class="form-input" placeholder="Nama Produk">
            <input type="text" id="newProdDesc" class="form-input" placeholder="Deskripsi singkat produk">
            <input type="text" id="newProdPrice" class="form-input" placeholder="Harga (misal: Rp 45.000)">
            <input type="url" id="newProdImg" class="form-input" placeholder="URL Gambar Produk (opsional)">
            <button class="btn-primary" onclick="addProduct()">+ Tambah Produk</button>
        </div>
        <div id="adminProdList" class="admin-item-list"></div>

        <button class="btn-danger" style="width: 100%; margin-top: 6px;" onclick="resetDefault()">Reset ke Data Awal</button>
    </section>

    <!-- Bagian Profil Publik -->
    <header class="profile-header">
        <div class="avatar-wrapper">
            <img id="displayAvatar" src="" alt="Logo TMY" class="avatar" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=TMY&background=0f172a&color=eab308&size=200';">
            <div class="verified-badge" title="Terverifikasi"><i class="fas fa-check"></i></div>
        </div>
        <h1 class="profile-name" id="displayName"></h1>
        <p class="profile-bio" id="displayBio"></p>

        <div class="social-row">
            <a href="#" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="https://github.com/hahhh6909-ai" target="_blank" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" class="social-icon" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </header>

    <!-- Navigasi Tab -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('links', this)">Tautan Utama</button>
        <button class="tab-btn" onclick="switchTab('products', this)">Produk Digital</button>
    </div>

    <!-- Tab 1: Daftar Tautan -->
    <main id="tab-links" class="tab-content active"></main>

    <!-- Tab 2: Produk Digital -->
    <section id="tab-products" class="tab-content"></section>

    <!-- Footer -->
    <footer class="footer">
        <button class="share-btn" onclick="copyLink()">
            <i class="fas fa-share-alt"></i> <span id="share-text">Salin Tautan TIMY_ILD</span>
        </button>
        <p>Powered by <strong>TIMY_ILD</strong> © 2026</p>
    </footer>
</div>

<script>
    const defaultData = {
        profile: {
            name: "@Hermawan.id",
            bio: "Web Developer, Bot Automation & AI Content Creator. Semua project dan produk digital resmi ada di TIMY_ILD.",
            avatar: "logo-tmy.png",
            wa: "6285177074922"
        },
        links: [
            {
                title: "TIMY_All-Project Portfolio",
                sub: "Koleksi lengkap project web & eksperimen",
                url: "https://github.com/hahhh6909-ai",
                icon: "fa-globe"
            },
            {
                title: "Repositori WhatsApp Bot (GitHub)",
                sub: "Source code bot otomasi Node.js",
                url: "https://github.com/hahhh6909-ai/BOT-wathsaap",
                icon: "fa-robot"
            },
            {
                title: "Jasa Pembuatan Website & Bot",
                sub: "Konsultasi langsung via WhatsApp",
                url: "https://wa.me/6285177074922",
                icon: "fab fa-whatsapp"
            }
        ],
        products: [
            {
                badge: "Source Code",
                title: "Script WhatsApp Bot Full Fitur",
                desc: "Script bot WhatsApp siap pakai berbasis Node.js lengkap dengan fitur stiker, downloader, dan menu interaktif.",
                price: "Rp 50.000",
                img: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80"
            },
            {
                badge: "Template Web",
                title: "Paket Template Landing Page Gelap",
                desc: "Template HTML/CSS responsif modern untuk personal branding maupun katalog digital.",
                price: "Rp 35.000",
                img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80"
            }
        ]
    };

    let siteData = JSON.parse(localStorage.getItem('timy_ild_data')) || defaultData;

    function saveData() {
        localStorage.setItem('timy_ild_data', JSON.stringify(siteData));
        renderAll();
    }

    function renderAll() {
        document.getElementById('displayName').innerText = siteData.profile.name;
        document.getElementById('displayBio').innerText = siteData.profile.bio;
        document.getElementById('displayAvatar').src = siteData.profile.avatar;

        document.getElementById('inputName').value = siteData.profile.name;
        document.getElementById('inputBio').value = siteData.profile.bio;
        document.getElementById('inputAvatar').value = siteData.profile.avatar;
        document.getElementById('inputWA').value = siteData.profile.wa;

        const linksContainer = document.getElementById('tab-links');
        const adminLinksContainer = document.getElementById('adminLinkList');
        linksContainer.innerHTML = '';
        adminLinksContainer.innerHTML = '';

        siteData.links.forEach((link, index) => {
            const iconClass = link.icon.startsWith('fab') ? link.icon : `fas ${link.icon}`;
            linksContainer.innerHTML += `
                <a href="${link.url}" target="_blank" class="link-card">
                    <div class="link-left">
                        <div class="link-icon"><i class="${iconClass}"></i></div>
                        <div>
                            <div class="link-title">${link.title}</div>
                            <div class="link-sub">${link.sub}</div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right" style="color: var(--text-muted); font-size: 0.85rem;"></i>
                </a>
            `;

            adminLinksContainer.innerHTML += `
                <div class="admin-item-row">
                    <span>${link.title}</span>
                    <button class="btn-danger" onclick="deleteLink(${index})">Hapus</button>
                </div>
            `;
        });

        const prodContainer = document.getElementById('tab-products');
        const adminProdContainer = document.getElementById('adminProdList');
        prodContainer.innerHTML = '';
        adminProdContainer.innerHTML = '';

        siteData.products.forEach((prod, index) => {
            const imgUrl = prod.img || "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80";
            prodContainer.innerHTML += `
                <div class="product-card">
                    <img src="${imgUrl}" alt="${prod.title}" class="product-img">
                    <div class="product-body">
                        <span class="product-badge">${prod.badge}</span>
                        <h2 class="product-title">${prod.title}</h2>
                        <p class="product-desc">${prod.desc}</p>
                        <div class="product-footer">
                            <span class="product-price">${prod.price}</span>
                            <button class="buy-btn" onclick="orderProduct('${prod.title.replace(/'/g, "\\'")}', '${prod.price}')">Beli Sekarang</button>
                        </div>
                    </div>
                </div>
            `;

            adminProdContainer.innerHTML += `
                <div class="admin-item-row">
                    <span>${prod.title} (${prod.price})</span>
                    <button class="btn-danger" onclick="deleteProduct(${index})">Hapus</button>
                </div>
            `;
        });
    }

    function toggleAdmin() {
        const panel = document.getElementById('adminPanel');
        const btn = document.getElementById('adminToggleBtn');
        panel.classList.toggle('open');
        btn.classList.toggle('active');
    }

    function saveProfile() {
        siteData.profile.name = document.getElementById('inputName').value;
        siteData.profile.bio = document.getElementById('inputBio').value;
        siteData.profile.avatar = document.getElementById('inputAvatar').value;
        siteData.profile.wa = document.getElementById('inputWA').value;
        saveData();
        alert('Profil TIMY_ILD berhasil diperbarui!');
    }

    function addLink() {
        const title = document.getElementById('newLinkTitle').value.trim();
        const sub = document.getElementById('newLinkSub').value.trim();
        const url = document.getElementById('newLinkUrl').value.trim();
        if (!title || !url) return alert('Judul dan URL tautan wajib diisi!');

        siteData.links.push({ title, sub, url, icon: 'fa-link' });
        document.getElementById('newLinkTitle').value = '';
        document.getElementById('newLinkSub').value = '';
        document.getElementById('newLinkUrl').value = '';
        saveData();
    }

    function deleteLink(index) {
        siteData.links.splice(index, 1);
        saveData();
    }

    function addProduct() {
        const badge = document.getElementById('newProdBadge').value.trim() || 'Digital';
        const title = document.getElementById('newProdTitle').value.trim();
        const desc = document.getElementById('newProdDesc').value.trim();
        const price = document.getElementById('newProdPrice').value.trim();
        const img = document.getElementById('newProdImg').value.trim();
        if (!title || !price) return alert('Nama produk dan harga wajib diisi!');

        siteData.products.push({ badge, title, desc, price, img });
        document.getElementById('newProdBadge').value = '';
        document.getElementById('newProdTitle').value = '';
        document.getElementById('newProdDesc').value = '';
        document.getElementById('newProdPrice').value = '';
        document.getElementById('newProdImg').value = '';
        saveData();
    }

    function deleteProduct(index) {
        siteData.products.splice(index, 1);
        saveData();
    }

    function resetDefault() {
        if (confirm('Kembalikan semua data ke pengaturan awal?')) {
            localStorage.removeItem('timy_ild_data');
            siteData = JSON.parse(JSON.stringify(defaultData));
            renderAll();
        }
    }

    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        btnElement.classList.add('active');
    }

    function orderProduct(productName, price) {
        const pesan = `Halo TIMY_ILD, saya ingin memesan produk digital:\n\n*Produk:* ${productName}\n*Harga:* ${price}\n\nMohon informasi pembayarannya.`;
        const url = `https://wa.me/${siteData.profile.wa}?text=${encodeURIComponent(pesan)}`;
        window.open(url, '_blank');
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const shareText = document.getElementById('share-text');
            shareText.innerText = "Tautan Tersalin!";
            setTimeout(() => {
                shareText.innerText = "Salin Tautan TIMY_ILD";
            }, 2000);
        });
    }

    renderAll();
</script>
